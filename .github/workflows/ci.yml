name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout CHOAM
        uses: actions/checkout@v6
        with:
          path: choam

      - name: Checkout sietch (composite build dependency)
        uses: actions/checkout@v6
        with:
          repository: jlmalone/sietch
          path: sietch

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        working-directory: choam
        run: ./gradlew build

      - name: Test
        working-directory: choam
        run: ./gradlew test

      - name: Upload test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-results
          path: choam/build/reports/tests/test/
